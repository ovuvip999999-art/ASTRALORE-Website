name: ASTRA Cloud Memory Validation

on:
  push:
    branches:
      - feature/astra-cloud-memory
      - feature/astra-creative-skills
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "backend/model-server/**"
      - "backend/worker.js"
      - "backend/queue-proxy.mjs"
      - "backend/creative-providers.js"
      - "backend/CREATIVE-GENERATION-SAFETY.md"
      - "backend/*.test.mjs"
      - "backend/migrations/**"
      - "backend/wrangler.toml"
      - "astra-page.js"
      - "astra-skills.js"
      - "astra-creative-studio.js"
      - "astra-document-editor.js"
      - "astra.html"
      - "astra-page.css"
      - "astra-cloud-*.js"
      - ".github/workflows/astra-cloud-validation.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker module syntax
        run: node --input-type=module --check < backend/worker.js
      - name: Check creative provider module syntax
        run: node --input-type=module --check < backend/creative-providers.js
      - name: Check private queue proxy syntax
        run: node --check backend/queue-proxy.mjs
      - name: Check browser JavaScript syntax
        run: |
          node --check astra-page.js
          node --check astra-skills.js
          node --check astra-creative-studio.js
          node --check astra-document-editor.js
          node --check astra-cloud-auth.js
          node --check astra-cloud-store.js
          node --check astra-config.js
      - name: Test document retrieval
        run: node --test backend/*.test.mjs
      - name: Check patch whitespace
        run: git diff --check

  model-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: astra_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d astra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASTRA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/astra_test
    defaults:
      run:
        working-directory: backend/model-server
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model server API dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile model server
        run: python -m py_compile app.py test_app.py test_http_api.py queue_api.py test_queue_api.py media_validation.py test_media_validation.py asset_store.py test_asset_store.py worker_api.py test_worker_api.py worker_client.py test_worker_client.py worker_runner.py test_worker_runner.py test_worker_end_to_end.py runtime_manifest.py test_runtime_manifest.py runtime_registry.py test_runtime_registry.py sandbox_policy.py test_sandbox_policy.py sandbox_executor.py test_sandbox_executor.py test_sandbox_executor_docker.py host_preflight.py test_host_preflight.py moderation_http.py test_moderation_http.py worker_process.py test_worker_process.py astra_sandbox_entrypoint.py test_astra_sandbox_entrypoint.py sandbox_adapter.py test_sandbox_adapter.py runtime_errors.py sd35_adapter.py test_sd35_adapter.py wan21_adapter.py test_wan21_adapter.py worker_bootstrap.py test_worker_bootstrap.py worker_process.py test_worker_process.py safety_gate.py test_safety_gate.py creative_brief.py test_creative_brief.py model_registry.py test_model_registry.py job_lifecycle.py test_job_lifecycle.py queue_store.py test_queue_store.py test_queue_migration.py test_queue_postgres.py quality_eval.py test_quality_eval.py
      - name: Test authentication and model readiness
        run: python -m unittest -v
