name: Build ASTRA Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-astra-android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-astra-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build universal debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check release signing secrets
        id: signing-check
        env:
          ASTRA_KEYSTORE_BASE64: ${{ secrets.ASTRA_KEYSTORE_BASE64 }}
          ASTRA_KEYSTORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
          ASTRA_KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}
          ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$ASTRA_KEYSTORE_BASE64" && -n "$ASTRA_KEYSTORE_PASSWORD" && -n "$ASTRA_KEY_ALIAS" && -n "$ASTRA_KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not all configured; skipping signed release APK."
          fi

      - name: Build signed release APK
        if: steps.signing-check.outputs.available == 'true'
        env:
          ASTRA_KEYSTORE_BASE64: ${{ secrets.ASTRA_KEYSTORE_BASE64 }}
          ASTRA_KEYSTORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
          ASTRA_KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}
          ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/astra-release.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$ASTRA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          # Print keytool's safe diagnostic (it never prints the supplied password).
          if ! KEYTOOL_DIAGNOSTIC="$(keytool -list -keystore "$KEYSTORE_PATH" -storepass:env ASTRA_KEYSTORE_PASSWORD -alias "$ASTRA_KEY_ALIAS" 2>&1)"; then
            echo "::error::Keystore verification failed. Safe keytool diagnostic follows:"
            echo "$KEYTOOL_DIAGNOSTIC"
            exit 1
          fi

          ASTRA_KEYSTORE_PATH="$KEYSTORE_PATH" gradle --no-daemon :app:assembleRelease

      - name: Upload signed release APK
        if: steps.signing-check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-Android-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
